{% extends 'base.html' %}

{% block content %}
<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow-sm">
        <div class="card-header bg-success text-white">
            <h4 class="mb-0">Add New Menu Item</h4>
        </div>
        <div class="card-body">
            <form method="POST" action="{{ url_for('item.add') }}">
                <div class="mb-3">
                    <label class="form-label">Item Name</label>
                    <input type="text" name="name" class="form-control" placeholder="e.g. Chicken Adobo" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Category</label>
                    <select name="category_id" class="form-select" required>
                        <option value="">-- Select Category --</option>
                        {% for cat in categories %}
                            <option value="{{ cat['id'] }}">{{ cat['name'] }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Price (₱)</label>
                    <input type="number" step="0.01" name="price" class="form-control" placeholder="150.00" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Availability</label>
                    <select name="is_available" class="form-select">
                        <option value="1" selected>Available</option>
                        <option value="0">Unavailable</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea name="description" class="form-control" rows="3" placeholder="Brief details about the dish..."></textarea>
                </div>
                <div class="d-flex justify-content-between">
                    <a href="{{ url_for('item.index') }}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-success">Save Item</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
