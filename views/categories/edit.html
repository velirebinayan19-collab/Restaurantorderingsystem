{% extends 'base.html' %}

{% block content %}
    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow-sm">
            <div class="card-header bg-warning text-dark">
                <h4 class="mb-0">Edit Menu Item</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('item.edit', id=item['id']) }}">
                    <div class="mb-3">
                        <label class="form-label">Item Name</label>
                        <input type="text" name="name" class="form-control" value="{{ item['name'] }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <select name="category_id" class="form-select" required>
                            {% for cat in categories %}
                                <option value="{{ cat['id'] }}" {% if cat['id'] == item['category_id'] %}selected{% endif %}>
                                    {{ cat['name'] }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Price (₱)</label>
                        <input type="number" step="0.01" name="price" class="form-control" value="{{ item['price'] }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Availability</label>
                        <select name="is_available" class="form-select">
                            <option value="1" {% if item['is_available'] == 1 %}selected{% endif %}>Available</option>
                            <option value="0" {% if item['is_available'] == 0 %}selected{% endif %}>Unavailable</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control" rows="3">{{ item['description'] }}</textarea>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('item.index') }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-warning">Update Item</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
