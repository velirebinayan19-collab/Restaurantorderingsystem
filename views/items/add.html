{% extends 'base.html' %}

{% block content %}
    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Add New Menu Item</h4>
            </div>
            <div class="card-body">
                {% with messages = get_flashed_messages(with_categories=true) %}
                  {% if messages %}
                    {% for cat, msg in messages %}
                      <div class="alert alert-{{ cat }} alert-dismissible fade show" role="alert">
                        {{ msg }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                      </div>
                    {% endfor %}
                  {% endif %}
                {% endwith %}

                <form method="POST" action="{{ url_for('item.add') }}">
                    <div class="mb-3">
                        <label for="name" class="form-label">Item Name *</label>
                        <input type="text" class="form-control" id="name" name="name" required placeholder="e.g., Cheese Burger">
                    </div>

                    <div class="mb-3">
                        <label for="category_id" class="form-label">Category *</label>
                        <select class="form-select" id="category_id" name="category_id" required>
                            <option value="" disabled selected>Select a Category</option>
                            {% for cat in categories %}
                                <option value="{{ cat['id'] }}">{{ cat['name'] }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="price" class="form-label">Price (₱) *</label>
                        <input type="number" step="0.01" class="form-control" id="price" name="price" required placeholder="e.g., 150.00">
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="3" placeholder="Brief details about the dish..."></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="is_available" class="form-label">Availability</label>
                        <select class="form-select" id="is_available" name="is_available">
                            <option value="1" selected>Available</option>
                            <option value="0">Unavailable</option>
                        </select>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('item.index') }}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-success">Save Item</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
   {% endblock %}
